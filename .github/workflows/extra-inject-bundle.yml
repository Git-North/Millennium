name: extra-inject bundle

# Builds the complete Millennium macOS bundle (Apple Silicon) with MILLENNIUM_EXTRA_INSERT_LIBRARIES support whenever this
# repository's default branch changes, for example when you sync it with upstream, and publishes it as the release
# "latest-build". The build is upstream's own (scripts/macos/lbk/build.sh and bundle.sh). The only difference is that the
# extra-inject change is added to this run's checkout first, so the branch stays free of it and syncing never conflicts.
# It needs no secrets: the bundle is ad-hoc signed, as upstream's build is without a signing certificate.
# It runs on GitHub's standard macOS runner, which is free for a public repository (a fork of a public repository is
# public). To use your own Mac instead, for a private repository, set the repository variable EXTRA_INJECT_RUNNER to
# ["self-hosted","macOS","ARM64"] (Settings > Secrets and variables > Actions > Variables).
# A failed run means upstream changed the code around one of the edits; the log names it and GitHub emails you.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

# One group per branch: a newer run replaces an older one on the same branch only. With one group for all branches, a
# push to any other branch cancelled a running release build, even though that push's own job was skipped.
concurrency:
  group: extra-inject-bundle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  KIT: scripts/macos/extra-inject

jobs:
  bundle:
    # Other branches are left alone: only the default branch is built on a push.
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    # Xcode on macos-14 ships a libc++ too old for this tree; macos-15 has a current one.
    runs-on: ${{ fromJSON(vars.EXTRA_INJECT_RUNNER || '"macos-15"') }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Use the same settings as upstream's own release workflow, so this build cannot drift from it.
      - name: Read upstream's build settings
        id: settings
        shell: bash
        run: |
          wf=.github/workflows/lbk-macos-release.yml
          target=$(sed -n 's/^  MACOSX_DEPLOYMENT_TARGET: "\(.*\)"/\1/p' "$wf" | head -n 1)
          openssl=$(sed -n 's/^  OPENSSL_VERSION: "\(.*\)"/\1/p' "$wf" | head -n 1)
          [ -n "$target" ] || { echo "::warning::MACOSX_DEPLOYMENT_TARGET not found in $wf; using 13.3"; target=13.3; }
          [ -n "$openssl" ] || { echo "::warning::OPENSSL_VERSION not found in $wf; using 3.5.9"; openssl=3.5.9; }
          echo "MACOSX_DEPLOYMENT_TARGET=$target" >> "$GITHUB_ENV"
          echo "OPENSSL_VERSION=$openssl" >> "$GITHUB_ENV"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "openssl=$openssl" >> "$GITHUB_OUTPUT"

      # A self-hosted runner uses the Xcode that is installed on that Mac.
      - name: Select Xcode
        if: runner.environment == 'github-hosted'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        run: |
          command -v rustup > /dev/null || { echo "::error::rustup is not installed on this runner (brew install rustup)"; exit 1; }
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Install build tools
        run: |
          brew install ninja cmake || true
          cmake --version
          clang --version

      # The wrapper app's Info.plist template gets MILLENNIUM_EXTRA_INSERT_LIBRARIES set to the repository variable
      # EXTRA_INJECT_LIBRARIES (':'-separated dylib paths; Proton-ish's dylib when it is not set), so an installed bundle
      # needs no manual setup. A path that does not exist is skipped with a warning.
      - name: Add the extra-inject change to this checkout
        shell: bash
        env:
          EXTRA_INJECT_DEFAULT_LIBRARIES: ${{ vars.EXTRA_INJECT_LIBRARIES }}
        run: |
          sh "$KIT/millennium-extra-inject.sh" patch-tree .
          git status --short

      - name: Resolve version
        id: version
        shell: bash
        run: |
          upstream="$(grep -v '^#' scripts/version | tr -d '[:space:]' | sed 's/^v//')"
          version="${upstream}-extra.${GITHUB_SHA::7}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Upstream ${upstream}, build ${version}"

      - name: Cache OpenSSL
        uses: actions/cache@v4
        with:
          path: build/lbk-deps/arm64
          key: lbk-openssl-${{ steps.settings.outputs.openssl }}-arm64-${{ steps.settings.outputs.target }}-macos-15-v1

      - name: Build
        run: bash scripts/macos/lbk/build.sh arm64

      # bundle.sh signs ad hoc, checks every binary, and dry-runs the installer against the result.
      - name: Assemble and verify the bundle
        id: bundle
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dist="${RUNNER_TEMP}/dist"
          bash scripts/macos/lbk/bundle.sh "$VERSION" arm64 "$dist"
          name="millennium-${VERSION}-darwin-arm64"
          (cd "$dist" && shasum -a 256 -c "${name}.tar.gz.sha256")
          for f in libmillennium_bootstrap.dylib steam_osx; do
            codesign --verify --strict "$dist/$name/runtime/$f"
            grep -q MILLENNIUM_EXTRA_INSERT_LIBRARIES "$dist/$name/runtime/$f" ||
              { echo "::error::$f does not contain the extra-inject change"; exit 1; }
          done
          cp "$dist/${name}.tar.gz" "$dist/millennium-darwin-arm64.tar.gz"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          ls -l "$dist"

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: |
            ${{ runner.temp }}/dist/${{ steps.bundle.outputs.name }}.tar.gz
            ${{ runner.temp }}/dist/${{ steps.bundle.outputs.name }}.tar.gz.sha256
          if-no-files-found: error

      # One .torrent per release asset. Each has the asset's GitHub download URL as a web seed (BEP 19, "url-list"), so a
      # client can download it when there are no peers. They are not marked private, so DHT and peer exchange work. A
      # torrent matches only its own build: the next release replaces what those URLs serve.
      - name: Create the torrents
        id: torrents
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          NAME: ${{ steps.bundle.outputs.name }}
        run: |
          command -v mktorrent > /dev/null || brew install mktorrent
          command -v aria2c > /dev/null || brew install aria2
          command -v jq > /dev/null || brew install jq
          dist="${RUNNER_TEMP}/dist"
          base="https://github.com/${GH_REPO}/releases/download/latest-build"
          trackers=(
            udp://tracker.opentrackr.org:1337/announce
            udp://open.stealth.si:80/announce
            udp://tracker.torrent.eu.org:451/announce
          )
          announce=()
          for t in "${trackers[@]}"; do announce+=(-a "$t"); done
          for asset in "${NAME}.tar.gz" "${NAME}.tar.gz.sha256" millennium-darwin-arm64.tar.gz; do
            torrent="$dist/${asset}.torrent"
            rm -f "$torrent"
            # -l 16 means 64 KiB pieces: about 100 for a bundle of a little over 6 MB.
            mktorrent -l 16 "${announce[@]}" -w "$base/$asset" -c "$GITHUB_SHA" -o "$torrent" "$dist/$asset"
            info=$(aria2c -S "$torrent")
            printf '%s\n' "$info"
            size=$(wc -c < "$dist/$asset" | tr -d ' ')
            grep -qxF "  1|./$asset" <<< "$info" ||
              { echo "::error::$asset.torrent does not list the file $asset"; exit 1; }
            grep '^Total Length: ' <<< "$info" | tr -d ',' | grep -qF "($size)" ||
              { echo "::error::$asset.torrent does not have the size of $asset ($size bytes)"; exit 1; }
            grep -qxF " $base/$asset" <<< "$info" ||
              { echo "::error::$asset.torrent has no web seed for $base/$asset"; exit 1; }
          done

          # The magnet link in the release notes is for the bundle under its stable name.
          asset=millennium-darwin-arm64.tar.gz
          hash=$(aria2c -S "$dist/${asset}.torrent" | sed -n 's/^Info Hash: //p')
          [[ "$hash" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no info hash for $asset.torrent"; exit 1; }
          magnet="magnet:?xt=urn:btih:${hash}&dn=${asset}"
          for t in "${trackers[@]}"; do magnet+="&tr=$(jq -rn --arg v "$t" '$v | @uri')"; done
          magnet+="&ws=$(jq -rn --arg v "$base/$asset" '$v | @uri')"
          echo "magnet=${magnet}" >> "$GITHUB_OUTPUT"

      # Kept with the run, so the torrents can be checked on a branch that does not publish a release.
      - name: Upload the torrents
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.name }}-torrents
          path: ${{ runner.temp }}/dist/*.torrent
          if-no-files-found: error

      - name: Publish the release
        if: github.ref_name == github.event.repository.default_branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NAME: ${{ steps.bundle.outputs.name }}
          MAGNET: ${{ steps.torrents.outputs.magnet }}
        run: |
          dist="${RUNNER_TEMP}/dist"
          cat > notes.md <<EOF
          Complete macOS build of Millennium (Apple Silicon) from commit ${GITHUB_SHA}, with MILLENNIUM_EXTRA_INSERT_LIBRARIES support. It is upstream's own build, ad-hoc signed.

          **Install with Homebrew (recommended)**

          Quit Steam before installing, upgrading or uninstalling.

          \`\`\`sh
          brew tap git-north/millennium https://github.com/Git-North/Millennium
          brew trust git-north/millennium
          brew install --cask git-north/millennium/millennium
          \`\`\`

          Update:

          \`\`\`sh
          brew upgrade --cask --greedy git-north/millennium/millennium
          \`\`\`

          Uninstall (keeps plugins and config):

          \`\`\`sh
          brew uninstall --cask git-north/millennium/millennium
          \`\`\`

          Add \`--zap\` to also move \`~/Library/Application Support/Millennium\`, which holds them, to the Trash.

          **Manual install**

          As an alternative to Homebrew, use the repository's script. This needs a clone of the repository, because the script path is relative to one, and aria2c (\`brew install aria2\`). Quit Steam, then run this from the root of the clone:

          \`\`\`sh
          sh ${KIT}/millennium-extra-inject.sh fetch ${GH_REPO}
          \`\`\`

          Then run the install command it prints.

          With either method, the wrapper app comes with MILLENNIUM_EXTRA_INSERT_LIBRARIES already set.

          **Download with BitTorrent**

          The asset \`millennium-darwin-arm64.tar.gz.torrent\` downloads the bundle. It uses GitHub as a web seed, so it works with no peers:

          \`\`\`sh
          aria2c --seed-time=0 https://github.com/${GH_REPO}/releases/download/latest-build/millennium-darwin-arm64.tar.gz.torrent
          \`\`\`

          This only downloads the bundle; it doesn't install it. A torrent matches only the build it was made for, so get the new one after an update. The other downloads in this release have .torrent files too.

          Magnet link for the same bundle. It doesn't include the torrent's file details, so your client needs at least one peer to send them. If there may be no peers, use the .torrent file.

          \`\`\`text
          ${MAGNET}
          \`\`\`
          EOF
          gh release delete latest-build --cleanup-tag --yes > /dev/null 2>&1 || true
          gh release create latest-build \
            "$dist/${NAME}.tar.gz" "$dist/${NAME}.tar.gz.sha256" "$dist/millennium-darwin-arm64.tar.gz" \
            "$dist/${NAME}.tar.gz.torrent" "$dist/${NAME}.tar.gz.sha256.torrent" \
            "$dist/millennium-darwin-arm64.tar.gz.torrent" \
            --target "$GITHUB_SHA" --title "Build of ${NAME}" --notes-file notes.md
