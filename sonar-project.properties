# SonarQube analysis settings for the Git-North Millennium fork, read by .github/workflows/sonarqube.yml.
# The project key, organization and server are passed by the workflow (from the SonarQube Cloud binding, or from
# repository variables for a self-hosted SonarQube Server), so the same file works for both.

sonar.projectName=Millennium (Git-North fork)
sonar.sourceEncoding=UTF-8

# SonarQube Cloud analyzes the whole repository by default (sonar.sources and sonar.tests no longer have an effect,
# the scanner warns about them), so the scope is set with exclusions. That covers C++, Objective-C++, TypeScript, Lua
# and Rust in src/, starlight/ and scripts/.
#
# Not analyzed:
#  - thirdparty/: vendored tarballs and forks (luajit, ...).
#  - packages/: Arch and Nix packaging.
#  - src/lua_host/api/json.c: lua-cjson (Mark Pulford), kept as upstream ships it.
#  - translations, lockfiles, icons, dependencies and build output.
sonar.exclusions=\
  thirdparty/**,\
  packages/**,\
  src/lua_host/api/json.c,\
  src/locales/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/*.lock,\
  **/*.icns

# Test code gets test rules and is left out of coverage and duplication metrics. The C++ tests under tests/cpp are not
# in the macOS build's compilation database (build.sh builds with MILLENNIUM_BUILD_TESTS=OFF), so the C/C++ analyzer
# skips them; the TypeScript and Lua tests are analyzed.
sonar.test.inclusions=\
  tests/**,\
  src/typescript/tests/**

# C/C++/Objective-C++ need the compilation database. The workflow builds with scripts/macos/lbk/build.sh, which writes
# it here. Files that are not part of the macOS build (src/bootstrap/linux, src/bootstrap/win32, ...) are not in it and
# are skipped by the C/C++ analyzer.
sonar.cfamily.compile-commands=build/osx-release/compile_commands.json
